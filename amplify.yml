version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - env | grep -e ^COGNITO_ -e ^NEXTAUTH_ -e ^AGENT_RUNTIME_ARN= -e ^CHAT_ACTOR_ID= -e ^CHAT_CONVERSATIONS_TABLE= -e ^CHAT_MESSAGES_TABLE= >> .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
